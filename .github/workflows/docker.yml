name: Build and push the image

# Build the image on each push and each pull request.
# Push the image to GHCR from the main branch and from each version tag.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run the tests
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v7

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install the requirements
        run: pip install -r requirements-dev.txt

      - name: Run the tests
        run: python -m pytest -q

  build:
    name: Build the image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Get the code
        uses: actions/checkout@v7

      - name: Install QEMU
        uses: docker/setup-qemu-action@v4

      - name: Install Buildx
        uses: docker/setup-buildx-action@v4

      - name: Sign in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Make the tags and the labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=settleup-mcp
            org.opencontainers.image.description=An MCP server for the Settle Up app

      # Build 1 architecture first. Then test the image before the push.
      - name: Build the test image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: settleup-mcp:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test the health route
        run: |
          docker run -d --rm --name settleup-mcp-test -p 8000:8000 \
            -e SETTLEUP_EMAIL=test@example.com \
            -e SETTLEUP_PASSWORD=test-password \
            -e SETTLEUP_FIREBASE_API_KEY=test-key \
            settleup-mcp:test
          for attempt in $(seq 1 20); do
            if curl -fsS http://localhost:8000/health; then
              echo
              echo "The health route answered."
              docker rm -f settleup-mcp-test
              exit 0
            fi
            sleep 2
          done
          echo "The health route did not answer."
          docker logs settleup-mcp-test
          docker rm -f settleup-mcp-test
          exit 1

      - name: Build and push the image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Attest the build
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
